name: Testes de segurança

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  seguranca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar o navegador de teste
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Conferir que texto de estranho não vira código
        run: node testes/seguranca.mjs
